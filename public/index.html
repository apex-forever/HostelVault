<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelVault | Hostel Management System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layouts.css">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- ============== Login Page ============== -->
  <div id="loginPage" class="login-bg flex items-center justify-center p-4">
    <div class="float-dot" style="width:200px;height:200px;top:10%;left:5%;animation-delay:0s"></div>
    <div class="float-dot" style="width:120px;height:120px;top:60%;right:10%;animation-delay:2s"></div>
    <div class="float-dot" style="width:80px;height:80px;bottom:20%;left:30%;animation-delay:4s"></div>
    <div class="float-dot" style="width:160px;height:160px;top:30%;right:30%;animation-delay:1s"></div>

    <div class="login-card fade-up">
      <div class="brand-icon"><i class="fas fa-building"></i></div>
      <h1 class="font-display text-center text-2xl font-extrabold mb-1" style="color:var(--primary)">HostelVault</h1>
      <p class="text-center text-sm mb-6" style="color:var(--text-muted)">Hostel Management System</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="Email address" required autocomplete="email">
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="loginSubmitBtn" style="margin-top:8px">
          <i class="fas fa-arrow-right" style="margin-right:6px"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ============== App Shell ============== -->
  <div id="appLayout" class="app-layout" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="flex items-center gap-3">
          <div style="width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center">
            <i class="fas fa-building" style="color:var(--accent);font-size:18px"></i>
          </div>
          <div>
            <div class="font-display font-bold text-base">HostelVault</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.5)">Management System</div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="flex items-center gap-3 mb-3">
          <div id="sidebarAvatar" style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--primary)"></div>
          <div>
            <div id="sidebarUserName" style="font-size:13px;font-weight:600"></div>
            <div id="sidebarUserRole" style="font-size:11px;color:rgba(255,255,255,0.5)"></div>
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" style="width:100%;color:rgba(255,255,255,0.6);justify-content:center" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-ghost btn-sm" id="menuToggle" aria-label="Toggle navigation" aria-expanded="true" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <div class="user-pill" onclick="navigate('profile')">
            <div class="avatar" id="topbarAvatar"></div>
            <span id="topbarName" style="font-size:13px;font-weight:600"></span>
          </div>
        </div>
      </header>
      <main class="page-content" id="pageContent"></main>
    </div>
  </div>

  <!-- Core JS, loaded in dependency order -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/router.js"></script>

  <!-- Page renderers -->
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/students.js"></script>
  <script src="/js/pages/wardens.js"></script>
  <script src="/js/pages/rooms.js"></script>
  <script src="/js/pages/blocks.js"></script>
  <script src="/js/pages/complaints.js"></script>
  <script src="/js/pages/fees.js"></script>
  <script src="/js/pages/visitors.js"></script>
  <script src="/js/pages/leaves.js"></script>
  <script src="/js/pages/attendance.js"></script>
  <script src="/js/pages/notices.js"></script>
  <script src="/js/pages/myroom.js"></script>
  <script src="/js/pages/profile.js"></script>

  <script src="/js/app.js"></script>
</body>
</html>
